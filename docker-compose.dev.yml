# Local development only: Postgres and SeaweedFS's S3 API (stands in for Cloudflare R2).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cotinha
      POSTGRES_PASSWORD: cotinha
      POSTGRES_DB: cotinha
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - devdb:/var/lib/postgresql/data

  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -master.volumeSizeLimitMB=128
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - devs3:/data

volumes:
  devdb:
  devs3:
